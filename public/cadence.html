<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>cadence</title>
  <style>
    @font-face {
      font-family: 'Recursive';
      src: url('/fonts/recursive.woff2') format('woff2');
      font-weight: 300 1000;
      font-stretch: 50% 150%;
      font-style: oblique -15deg 0deg;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #E7E2D6;
      font-family: 'IBM Plex Mono', monospace;
      color: #171512;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid #B9AFA0;
      flex-shrink: 0;
    }
    .top-bar .brand { display: flex; align-items: center; gap: 16px; }
    .top-bar .brand span:first-child { font-size: 12px; letter-spacing: 0.1em; font-weight: 600; }
    .top-bar .brand span:last-child { font-size: 10px; color: #B9AFA0; }
    .top-bar .controls { display: flex; gap: 12px; }
    .top-bar .controls button {
      background: none;
      border: 1px solid #B9AFA0;
      color: #171512;
      padding: 4px 16px;
      font-size: 10px;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.08em;
      border-radius: 0;
      text-transform: uppercase;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .top-bar .controls button:hover:not(:disabled) {
      background: #171512;
      color: #E7E2D6;
      border-color: #171512;
    }
    .top-bar .controls button:disabled { opacity: 0.5; cursor: not-allowed; }

    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    #inputState {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    #inputState.hidden { display: none; }

    #traceContainer {
      flex: 1;
      position: relative;
      border: 1px solid #B9AFA0;
      min-height: 200px;
      background: #E7E2D6;
    }
    #traceContainer canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #inputRow {
      padding-top: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid #B9AFA0;
    }
    #inputRow .prompt { font-size: 12px; color: #B9AFA0; }
    #inputRow input {
      background: none;
      border: none;
      outline: none;
      color: #171512;
      font-size: 16px;
      font-family: 'IBM Plex Mono', monospace;
      flex: 1;
      padding: 4px 0;
      caret-color: #C89B3C;
      width: 100%;
    }

    #commitBtn {
      background: none;
      border: 1px solid #171512;
      color: #171512;
      padding: 4px 16px;
      font-size: 11px;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.08em;
      border-radius: 0;
      text-transform: uppercase;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      flex-shrink: 0;
      white-space: nowrap;
    }
    #commitBtn:hover:not(:disabled) {
      background: #171512;
      color: #E7E2D6;
      border-color: #171512;
    }
    #commitBtn:disabled { opacity: 0.3; cursor: not-allowed; }

    #portraitState {
      flex: 1;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: #E7E2D6;
    }
    #portraitState.visible { display: flex; }

    #portraitText {
      font-family: 'Recursive', sans-serif;
      font-size: clamp(28px, 7vw, 64px);
      line-height: 1.3;
      color: #171512;
      max-width: 800px;
      width: 100%;
      text-align: center;
      word-break: break-word;
    }
    #portraitText span {
      display: inline-block;
      margin-right: 2px;
    }

    .footer {
      padding: 8px 20px;
      border-top: 1px solid #B9AFA0;
      text-align: center;
      font-size: 9px;
      color: #B9AFA0;
      font-family: 'IBM Plex Mono', monospace;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <div class="brand"><span>cadence</span><span>by ace</span></div>
  <div class="controls">
    <button id="replayBtn" disabled>replay</button>
  </div>
</div>

<div class="main-area">
  <div id="inputState">
    <div id="traceContainer">
      <canvas id="traceCanvas"></canvas>
    </div>
    <div id="inputRow">
      <span class="prompt">&gt;</span>
      <input type="text" id="textInput" placeholder="type something…" autofocus />
      <button id="commitBtn" disabled>reveal</button>
    </div>
  </div>

  <div id="portraitState">
    <div id="portraitText"></div>
  </div>
</div>

<div class="footer" id="footer">type something, then tap "reveal"</div>

<script>
  // --- DOM ---
  const inputState = document.getElementById('inputState');
  const portraitState = document.getElementById('portraitState');
  const portraitTextEl = document.getElementById('portraitText');
  const textInput = document.getElementById('textInput');
  const canvas = document.getElementById('traceCanvas');
  const ctx = canvas.getContext('2d');
  const footer = document.getElementById('footer');
  const replayBtn = document.getElementById('replayBtn');
  const commitBtn = document.getElementById('commitBtn');

  // --- State ---
  let text = '';
  let trace = [];
  let portraitData = '';
  let isPortrait = false;
  let isReplaying = false;
  let replayTimer = null;
  let pauseTimer = null;

  const PAUSE_MS = 1500;

  // --- Draw ---
  function draw() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.scale(dpr, dpr);

    ctx.clearRect(0, 0, rect.width, rect.height);

    ctx.strokeStyle = '#B9AFA0';
    ctx.lineWidth = 0.5;
    ctx.globalAlpha = 0.2;
    for (let x = 0; x <= rect.width; x += 20) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, rect.height); ctx.stroke();
    }
    for (let y = 0; y <= rect.height; y += 20) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(rect.width, y); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    if (trace.length < 2) return;

    const pad = 20;
    const w = rect.width - pad * 2;
    const h = rect.height - pad * 2;
    const maxY = Math.max(...trace.map(p => p.y), 1);

    ctx.beginPath();
    ctx.strokeStyle = '#3F6F5E';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#3F6F5E';
    ctx.shadowBlur = 6;

    trace.forEach((p, i) => {
      const x = pad + (p.x / (trace.length - 1 || 1)) * w;
      const y = rect.height - pad - (p.y / maxY) * h;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // --- Show portrait ---
  function showPortrait() {
    isPortrait = true;
    inputState.classList.add('hidden');
    portraitState.classList.add('visible');
    replayBtn.disabled = false;
    commitBtn.disabled = true;
    footer.textContent = 'portrait — tap replay to watch the trace again';

    const chars = portraitData.split('');

    portraitTextEl.innerHTML = '';
    chars.forEach((ch, i) => {
      const weight = 300 + (i / Math.max(chars.length - 1, 1)) * 500;
      const width = 50 + (i / Math.max(chars.length - 1, 1)) * 100;
      const slant = (i / Math.max(chars.length - 1, 1)) * 15;
      const span = document.createElement('span');
      span.textContent = ch;
      span.style.fontVariationSettings = `'wght' ${weight}, 'wdth' ${width}, 'slnt' ${slant}`;
      span.style.transition = `font-variation-settings 0.4s ease ${i * 20}ms`;
      portraitTextEl.appendChild(span);
    });
  }

  // --- Commit ---
  function commit() {
    if (isPortrait || text.trim().length === 0) return;
    clearTimeout(pauseTimer);
    portraitData = text;
    showPortrait();
  }

  // --- Reset ---
  function resetToInput() {
    clearTimeout(pauseTimer);
    clearTimeout(replayTimer);
    isPortrait = false;
    isReplaying = false;
    text = '';
    trace = [];
    portraitData = '';
    textInput.value = '';
    inputState.classList.remove('hidden');
    portraitState.classList.remove('visible');
    replayBtn.disabled = true;
    commitBtn.disabled = true;
    footer.textContent = 'type something, then tap "reveal"';
    draw();
    textInput.focus();
  }

  // --- Replay ---
  function replay() {
    if (isReplaying || portraitData.length === 0) return;
    isReplaying = true;
    replayBtn.disabled = true;

    const chars = portraitData.split('');
    const pts = [];
    chars.forEach((_, i) => {
      pts.push({ x: i, y: (i / Math.max(chars.length - 1, 1)) });
    });
    trace = pts;

    inputState.classList.remove('hidden');
    portraitState.classList.remove('visible');
    draw();

    let step = 0;
    function stepReplay() {
      if (step >= pts.length) {
        isReplaying = false;
        showPortrait();
        return;
      }
      trace = pts.slice(0, step + 1);
      draw();
      step++;
      replayTimer = setTimeout(stepReplay, 60);
    }
    stepReplay();
  }

  // --- Input ---
  function onInput(e) {
    if (isPortrait) return;
    const val = e.target.value;
    text = val;

    const chars = val.split('');
    trace = chars.map((_, i) => ({
      x: i,
      y: (i / Math.max(chars.length - 1, 1))
    }));

    draw();

    // Enable/disable commit button
    if (val.trim().length > 0) {
      commitBtn.disabled = false;
    } else {
      commitBtn.disabled = true;
    }

    // Reset pause timer on each input
    clearTimeout(pauseTimer);
    if (val.trim().length > 0) {
      pauseTimer = setTimeout(commit, PAUSE_MS);
    }
  }

  // --- Resize ---
  function onResize() {
    if (!isPortrait || isReplaying) draw();
  }

  // --- Init ---
  function init() {
    textInput.addEventListener('input', onInput);
    commitBtn.addEventListener('click', commit);
    replayBtn.addEventListener('click', replay);
    window.addEventListener('resize', onResize);
    draw();
    textInput.focus();
  }

  document.fonts.load('16px Recursive').then(init).catch(init);
  if (document.readyState === 'complete') setTimeout(init, 100);
  else document.addEventListener('DOMContentLoaded', () => setTimeout(init, 100));
</script>
</body>
</html>
