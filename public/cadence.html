<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>cadence</title>
  <style>
    @font-face {
      font-family: 'Recursive';
      src: url('/fonts/recursive.woff2') format('woff2');
      font-weight: 300 1000;
      font-stretch: 50% 150%;
      font-style: oblique -15deg 0deg;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #E7E2D6;
      font-family: 'IBM Plex Mono', monospace;
      color: #171512;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid #B9AFA0;
      flex-shrink: 0;
    }
    .top-bar .brand { display: flex; align-items: center; gap: 16px; }
    .top-bar .brand span:first-child { font-size: 12px; letter-spacing: 0.1em; font-weight: 600; }
    .top-bar .brand span:last-child { font-size: 10px; color: #B9AFA0; }
    .top-bar .controls { display: flex; gap: 12px; }
    .top-bar .controls button {
      background: none;
      border: 1px solid #B9AFA0;
      color: #171512;
      padding: 4px 16px;
      font-size: 10px;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.08em;
      border-radius: 0;
      text-transform: uppercase;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .top-bar .controls button:hover:not(:disabled) {
      background: #171512;
      color: #E7E2D6;
      border-color: #171512;
    }
    .top-bar .controls button:disabled { opacity: 0.5; cursor: not-allowed; }

    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* --- Input state --- */
    #inputState {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    #inputState.hidden { display: none; }

    #traceContainer {
      flex: 1;
      position: relative;
      border: 1px solid #B9AFA0;
      min-height: 200px;
      background: #E7E2D6;
    }
    #traceContainer canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #inputRow {
      padding-top: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid #B9AFA0;
    }
    #inputRow .prompt { font-size: 12px; color: #B9AFA0; }
    #inputRow input {
      background: none;
      border: none;
      outline: none;
      color: #171512;
      font-size: 16px;
      font-family: 'IBM Plex Mono', monospace;
      flex: 1;
      padding: 4px 0;
      caret-color: #C89B3C;
      width: 100%;
    }
    #inputRow .char-count { font-size: 10px; color: #B9AFA0; }

    /* --- Portrait state --- */
    #portraitState {
      flex: 1;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: #E7E2D6;
    }
    #portraitState.visible { display: flex; }

    #portraitText {
      font-family: 'Recursive', sans-serif;
      font-size: clamp(28px, 7vw, 64px);
      line-height: 1.3;
      color: #171512;
      max-width: 800px;
      width: 100%;
      text-align: center;
      word-break: break-word;
    }
    #portraitText span {
      display: inline-block;
      margin-right: 2px;
    }

    /* --- Footer --- */
    .footer {
      padding: 8px 20px;
      border-top: 1px solid #B9AFA0;
      text-align: center;
      font-size: 9px;
      color: #B9AFA0;
      font-family: 'IBM Plex Mono', monospace;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <div class="brand"><span>cadence</span><span>by ace</span></div>
  <div class="controls">
    <button id="replayBtn" disabled>replay</button>
  </div>
</div>

<div class="main-area">
  <div id="inputState">
    <div id="traceContainer">
      <canvas id="traceCanvas"></canvas>
    </div>
    <div id="inputRow">
      <span class="prompt">&gt;</span>
      <input type="text" id="textInput" placeholder="type something…" autofocus />
      <span class="char-count" id="charCount">0</span>
    </div>
  </div>

  <div id="portraitState">
    <div id="portraitText"></div>
  </div>
</div>

<div class="footer" id="footer">avg gap: 0ms &bull; peaks: 0</div>

<script>
  // --- DOM refs ---
  const inputState = document.getElementById('inputState');
  const portraitState = document.getElementById('portraitState');
  const portraitTextEl = document.getElementById('portraitText');
  const textInput = document.getElementById('textInput');
  const charCount = document.getElementById('charCount');
  const canvas = document.getElementById('traceCanvas');
  const ctx = canvas.getContext('2d');
  const footer = document.getElementById('footer');
  const replayBtn = document.getElementById('replayBtn');

  // --- State ---
  let text = '';
  let gaps = [];
  let trace = [];
  let isPortrait = false;
  let isReplaying = false;
  let pauseTimer = null;
  let replayTimer = null;
  let portraitData = { text: '', gaps: [] };
  let stats = { avgGap: 0, peaks: 0 };

  const PAUSE_MS = 1500;
  const MIN_GAP = 20;
  const MAX_GAP = 400;

  // --- Helpers ---
  function findPeaks(points) {
    if (points.length < 3) return [];
    const p = [];
    for (let i = 1; i < points.length - 1; i++) {
      if (points[i].y > points[i-1].y && points[i].y > points[i+1].y) p.push(i);
    }
    return p;
  }

  // --- Draw ---
  function draw() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.scale(dpr, dpr);

    ctx.clearRect(0, 0, rect.width, rect.height);

    // grid
    ctx.strokeStyle = '#B9AFA0';
    ctx.lineWidth = 0.5;
    ctx.globalAlpha = 0.2;
    for (let x = 0; x <= rect.width; x += 20) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, rect.height); ctx.stroke();
    }
    for (let y = 0; y <= rect.height; y += 20) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(rect.width, y); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    if (trace.length < 2) return;

    const pad = 20;
    const w = rect.width - pad * 2;
    const h = rect.height - pad * 2;
    const maxY = Math.max(...trace.map(p => p.y), 1);

    ctx.beginPath();
    ctx.strokeStyle = '#3F6F5E';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#3F6F5E';
    ctx.shadowBlur = 6;

    trace.forEach((p, i) => {
      const x = pad + (p.x / (trace.length - 1 || 1)) * w;
      const y = rect.height - pad - (p.y / maxY) * h;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();

    ctx.shadowBlur = 0;
    const peaks = findPeaks(trace);
    peaks.forEach(idx => {
      const p = trace[idx];
      const x = pad + (p.x / (trace.length - 1 || 1)) * w;
      const y = rect.height - pad - (p.y / maxY) * h;
      ctx.fillStyle = '#C89B3C';
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  // --- Show portrait ---
  function showPortrait() {
    isPortrait = true;
    inputState.classList.add('hidden');
    portraitState.classList.add('visible');
    replayBtn.disabled = false;

    const chars = portraitData.text.split('');
    const g = portraitData.gaps;
    const valid = g.filter(x => x > 0);
    const minG = Math.min(...valid, 20);
    const maxG = Math.max(...valid, 200);

    portraitTextEl.innerHTML = '';
    chars.forEach((ch, i) => {
      const gap = g[i] || 30;
      const norm = Math.max(0, Math.min(1, (gap - minG) / (maxG - minG + 1)));
      const weight = 300 + norm * 500;
      const width = 50 + norm * 100;
      const slant = norm * 15;
      const span = document.createElement('span');
      span.textContent = ch;
      span.style.fontVariationSettings = `'wght' ${weight}, 'wdth' ${width}, 'slnt' ${slant}`;
      span.style.transition = 'font-variation-settings 0.4s ease';
      span.style.transitionDelay = (i * 20) + 'ms';
      portraitTextEl.appendChild(span);
    });

    footer.textContent = `avg gap: ${stats.avgGap}ms \u2022 peaks: ${stats.peaks} \u2022 portrait`;
  }

  // --- Commit ---
  function commit() {
    if (isPortrait || text.trim().length === 0) return;
    clearTimeout(pauseTimer);

    portraitData.text = text;
    portraitData.gaps = [...gaps];

    const valid = gaps.filter(g => g > 0);
    stats.avgGap = valid.length > 0 ? Math.round(valid.reduce((a,b) => a+b, 0) / valid.length) : 0;
    stats.peaks = findPeaks(trace).length;

    showPortrait();
  }

  // --- Reset to input ---
  function resetToInput() {
    clearTimeout(pauseTimer);
    clearTimeout(replayTimer);
    isPortrait = false;
    isReplaying = false;
    text = '';
    gaps = [];
    trace = [];
    portraitData = { text: '', gaps: [] };
    textInput.value = '';
    charCount.textContent = '0';
    inputState.classList.remove('hidden');
    portraitState.classList.remove('visible');
    replayBtn.disabled = true;
    footer.textContent = 'avg gap: 0ms \u2022 peaks: 0';
    draw();
    textInput.focus();
  }

  // --- Replay ---
  function replay() {
    if (isReplaying || portraitData.text.length === 0) return;
    isReplaying = true;
    replayBtn.disabled = true;

    const g = portraitData.gaps;
    const pts = [];
    let x = 0;
    g.forEach(gap => {
      const n = Math.min(Math.max(gap, MIN_GAP), MAX_GAP);
      pts.push({ x: x, y: (n - MIN_GAP) / (MAX_GAP - MIN_GAP) });
      x++;
    });
    trace = pts;

    inputState.classList.remove('hidden');
    portraitState.classList.remove('visible');
    draw();

    let step = 0;
    function stepReplay() {
      if (step >= pts.length) {
        isReplaying = false;
        showPortrait();
        return;
      }
      trace = pts.slice(0, step + 1);
      draw();
      step++;
      const delay = Math.min(g[step] || 30, 150);
      replayTimer = setTimeout(stepReplay, delay);
    }
    stepReplay();
  }

  // --- Input handlers ---
  function onInput(e) {
    if (isPortrait) return;
    const val = e.target.value;
    const now = performance.now();

    if (val.length < text.length) {
      text = val;
      gaps = gaps.slice(0, val.length);
      trace = trace.slice(0, val.length);
      charCount.textContent = val.length;
      draw();
      return;
    }

    const last = gaps.length > 0 ? gaps[gaps.length - 1] : 0;
    const gap = last > 0 ? now - timestamps[timestamps.length - 1] : 0;
    timestamps.push(now);

    text = val;
    gaps.push(gap);

    const norm = Math.min(Math.max(gap, MIN_GAP), MAX_GAP);
    trace.push({ x: trace.length, y: (norm - MIN_GAP) / (MAX_GAP - MIN_GAP) });

    charCount.textContent = val.length;
    draw();

    clearTimeout(pauseTimer);
    pauseTimer = setTimeout(commit, PAUSE_MS);
  }

  let timestamps = [];

  function onKey(e) {
    if (e.key === 'Enter' && text.trim().length > 0 && !isPortrait) {
      e.preventDefault();
      commit();
    }
  }

  // --- Resize ---
  function onResize() {
    if (!isPortrait || isReplaying) draw();
  }

  // --- Init ---
  function init() {
    textInput.addEventListener('input', onInput);
    textInput.addEventListener('keydown', onKey);
    replayBtn.addEventListener('click', replay);
    window.addEventListener('resize', onResize);
    draw();
    textInput.focus();
  }

  // Start
  document.fonts.load('16px Recursive').then(init).catch(init);
  if (document.readyState === 'complete') setTimeout(init, 100);
  else document.addEventListener('DOMContentLoaded', () => setTimeout(init, 100));
</script>
</body>
</html>
